<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Numinar Mock Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#07121c;--panel:#102131;--line:#29465d;--text:#eaf5fb;--muted:#8ea9ba;--cyan:#55dced;--green:#5ce0a0;--red:#ff7586}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0d2a3a,var(--bg) 35%);color:var(--text);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}header{position:sticky;top:0;padding:17px 22px;background:#07121cee;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}h1{font:700 20px system-ui;margin:0}.live{margin-left:auto;color:var(--green)}main{max-width:1600px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,.box{background:var(--panel);border:1px solid var(--line);border-radius:10px}.card{padding:14px}.card b{display:block;color:var(--cyan);font-size:25px}.card span,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px;margin-top:18px}.box h2{font:650 14px system-ui;margin:0;padding:11px 13px;border-bottom:1px solid var(--line)}pre{margin:0;padding:12px;overflow:auto;max-height:520px;background:#08131d;color:#cce7f4;white-space:pre-wrap}details{border-bottom:1px solid var(--line)}summary{padding:9px 12px;cursor:pointer;display:flex;gap:10px}.ok{color:var(--green)}.bad{color:var(--red)}
</style></head><body><header><h1>Numinar Mock // live state</h1><span class="muted">OTP + workflow diagnostics</span><span class="live" id="status">connecting</span></header><main><section class="cards" id="cards"></section><section class="grid" id="content"></section></main>
<script>
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const pretty=v=>JSON.stringify(v,null,2);
const box=(title,value)=>`<section class="box"><h2>${esc(title)}</h2><pre>${esc(pretty(value))}</pre></section>`;
function reqs(rows){return `<section class="box"><h2>HTTP requests</h2>${rows.slice().reverse().map(x=>`<details><summary><b>${esc(x.method)}</b><span>${esc(x.path)}</span><span class="${x.status>=400?'bad':'ok'}">${x.status}</span><span class="muted">${x.duration_ms}ms</span></summary><pre>${esc(pretty(x))}</pre></details>`).join('')}</section>`}
async function load(){try{const r=await fetch('/__mock/state',{cache:'no-store'});if(!r.ok)throw Error(r.status);const s=await r.json();status.textContent='connected · '+new Date().toLocaleTimeString();cards.innerHTML=Object.entries(s.summary).map(([k,v])=>`<div class="card"><b>${v}</b><span>${esc(k.replaceAll('_',' '))}</span></div>`).join('');content.innerHTML=box('Issued OTPs',s.otps)+box('Interaction mix',s.breakdowns.interaction_types)+box('Recent interactions',s.interactions.slice(-30))+box('QA tracking',s.qa_pings.slice(-30))+reqs(s.requests)+box('Fixtures',{users:s.users,orgs:s.orgs,projects:s.projects})}catch(e){status.textContent='disconnected'}}load();setInterval(()=>{if(!document.hidden)load()},2000);
</script></body></html>
