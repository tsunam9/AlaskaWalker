plugins {
    id "com.android.application"
}

android {
    namespace "com.alaskacampaign.walker"
    compileSdk 35

    defaultConfig {
        // Placeholder identity (plan §10 open decision 3). Both store apps are
        // vendor-signed, so there is no in-place upgrade path regardless;
        // final applicationId/branding is the user's call.
        applicationId "com.alaskacampaign.walker"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
